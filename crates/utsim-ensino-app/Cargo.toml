[package]
name = "utsim-ensino-app"
description = "UTSim Ensino: the teaching app of the UTSim family (native window)"
version = "0.1.0"
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-ensino"
path = "src/main.rs"

[dependencies]
utsim-ensino-ui = { workspace = true }
utsim-ensino-store = { workspace = true }
# Same egui as the launcher and the Seis Sigma app; glow renderer only (lab computers
# without a graphics card).
# The family icon on the title bar (PNG decoding of `familia`).
utsim-ui-tema = { workspace = true, features = ["familia"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
